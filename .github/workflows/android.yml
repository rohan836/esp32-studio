name: Android CI

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go for Android Arduino CLI
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"

      - name: Build Android Arduino CLI
        run: |
          git clone --filter=blob:none https://github.com/ipodvideo87/arduino-cli-android.git /tmp/arduino-cli-android
          git -C /tmp/arduino-cli-android checkout 06f598c420f638891545631f9bf08ca11a8523e3
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd /tmp/arduino-cli-android
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -buildvcs=false -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libarduino_cli.so" .
          chmod 755 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libarduino_cli.so"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Verify Android SDK
        run: |
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android build packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon test

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: esp32-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


  desktop-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: \${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Compile desktop bridge
        run: python -m py_compile desktop/esp_studio.py desktop/test_esp_studio.py
      - name: Run desktop unit tests
        run: python -m unittest desktop/test_esp_studio.py -v
